services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: rp-mon-portainer
    command: -H unix:///var/run/docker.sock
    ports: ["9443:9443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: rp-mon-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    ports: ["9090:9090"]
    networks: [mon]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: rp-mon-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    networks: [mon]
    depends_on: [prometheus]
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:v1.8.1
    container_name: rp-mon-node
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    networks: [mon]
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: rp-mon-cadvisor
    privileged: true
    devices: ["/dev/kmsg:/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [mon]
    restart: unless-stopped

  rootpath_exporter:
    build: ./exporter
    container_name: rp-mon-exporter
    environment:
      DB_HOST: rootpath-platform-db-1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASS: ${DB_PASSWORD}
      DB_NAME: ctfd
    networks: [mon, rootpath]
    restart: unless-stopped

networks:
  mon: {}
  rootpath:
    external: true

volumes:
  portainer_data: {}
  grafana_data: {}
  prometheus_data: {}
