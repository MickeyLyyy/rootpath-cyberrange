<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InnovaERP · Panel Corporativo</title>
<link rel="stylesheet" href="/static/bootstrap.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">IE</span> InnovaERP</div>
    <nav>
      <a class="nav-item {{ 'active' if active=='panel' }}" href="/panel">&#128202; Escritorio</a>
      <a class="nav-item {{ 'active' if active=='clientes' }}" href="/panel/clientes">&#128101; Clientes</a>
      <a class="nav-item" href="#">&#128230; Inventario</a>
      <a class="nav-item" href="#">&#128176; Facturaci&oacute;n</a>
      <a class="nav-item {{ 'active' if active=='inte' }}" href="/panel/integraciones">&#9881; Integraciones</a>
    </nav>
    <div class="sidebar-foot">v3.4.1 · prod</div>
  </aside>
  <main class="content">
    <header class="topbar">
      <div class="crumb">InnovaERP <span>/ {{ title }}</span></div>
      <div class="user">
        <span class="avatar">{{ (user.user[0]|upper) if user else '?' }}</span>
        <span>{{ user.user if user else '' }}</span>
        <a class="btn btn-sm btn-outline-secondary" href="/logout">Salir</a>
      </div>
    </header>
    <div class="page">{% block body %}{% endblock %}</div>
  </main>
</div>
<script src="/static/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
