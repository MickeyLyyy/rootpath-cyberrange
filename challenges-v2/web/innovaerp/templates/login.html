<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>InnovaERP · Acceso</title>
<link rel="stylesheet" href="/static/bootstrap.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-bg">
<div class="login-box">
  <div class="login-card">
    <div class="brand-center"><span class="logo">IE</span> InnovaERP</div>
    <p class="text-muted small mb-4">Portal corporativo · acceso restringido</p>
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="mb-3"><label class="form-label">Usuario</label>
        <input class="form-control" name="usuario" autofocus></div>
      <div class="mb-3"><label class="form-label">Contrase&ntilde;a</label>
        <input class="form-control" type="password" name="clave"></div>
      <button class="btn btn-primary w-100">Entrar</button>
    </form>
    <div class="text-muted small mt-3">Soporte: soporte@innovaerp.do</div>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
